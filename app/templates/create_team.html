{% extends "base.html" %}

{% block content %}
<div class="create-team">
    <h1>Create Team</h1>
    <form method="POST" action="{{ url_for('routes.create_team') }}">
        {{ form.hidden_tag() }}
        {{ form.team_name.label }} {{ form.team_name }}
        {{ form.captain_id.label }} {{ form.captain_id }}
        <div class="mt-2">
            {{ form.looking_for_members() }} {{ form.looking_for_members.label }}
        </div>
        {{ form.submit }}
    </form>
</div>
{% endblock %}
